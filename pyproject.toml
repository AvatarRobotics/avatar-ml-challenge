[project]
name = "avatar-ml-challenge"
version = "0.1.0"
description = "Avatar Robotics ML Engineer code challenge — teleop MCAP to LeRobot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcap>=1.2.0",
  "numpy>=1.26",
  "av>=12.0.0",
  "pillow>=10.0.0",
  "matplotlib>=3.8.0",
  "pyarrow>=15.0.0",
  "pandas>=2.1.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
lerobot = [
  "lerobot>=0.3.0",
]
dev = [
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["challenge_lib"]

[tool.ruff]
line-length = 100
target-version = "py311"
